name: Backend Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier from sleeping (15 min inactivity timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://evolveaura-backend.onrender.com"
          fi
          echo "Pinging health endpoint: ${BACKEND_URL}/health"
          curl -s -f -m 30 "${BACKEND_URL}/health" || echo "Ping failed or server waking up"
